<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in Register | H.O.M.E Hub</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dg:#006837;--lg:#39b54a;--db:#0e386a;--or:#f58221;
  --bg:#f5f6fa;--card:#fff;--border:#e2e8f0;--text:#1a202c;--muted:#64748b;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
input,button{font-family:'Montserrat',sans-serif;font-size:16px}
.header{background:var(--db);padding:14px 16px;display:flex;align-items:center;gap:12px}
.header img{height:32px}
.header h1{font-family:'League Spartan',sans-serif;font-size:.95rem;font-weight:700;color:#fff}
.hero{background:linear-gradient(135deg,var(--dg),#004d28);padding:20px 20px 18px;text-align:center}
.hero h2{font-family:'League Spartan',sans-serif;font-size:1.2rem;font-weight:700;color:#fff;margin-bottom:4px}
.hero p{font-size:.8rem;color:rgba(255,255,255,.85);font-weight:500}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.count-strip{display:flex;gap:10px;margin-bottom:16px}
.count-card{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.count-card .num{font-family:'League Spartan',sans-serif;font-size:1.4rem;font-weight:700;color:var(--dg)}
.count-card .lbl{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:2px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px}
.row-name{flex:1}
.row-name strong{display:block;font-size:.9rem;color:var(--text)}
.row-name span{font-size:.72rem;color:var(--muted);font-weight:500}
.checkin-btn{background:var(--or);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:.78rem;font-weight:700;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.checkin-btn.done{background:#f0fdf4;color:var(--dg);border:1.5px solid #bbf7d0}
.checkin-btn:disabled{opacity:.7}
.add-row{display:flex;gap:8px;margin-top:16px}
.add-row input{flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border)}
.add-row button{background:var(--db);color:#fff;border:none;border-radius:10px;padding:0 18px;font-weight:700;font-size:.85rem;cursor:pointer;touch-action:manipulation}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:.82rem}
.loading{text-align:center;padding:40px 16px;color:var(--muted);font-size:.85rem}
.footer{text-align:center;padding:24px 16px 6px;font-size:.68rem;color:var(--muted)}
</style>
</head>
<body>

<div class="header">
  <img src="https://homehub-benfleet.co.uk/wp-content/uploads/2026/03/HOME_HUB_NO_BACKGROUND.png" alt="H.O.M.E Hub">
  <h1>H.O.M.E Hub — Check-in</h1>
</div>

<div class="hero">
  <h2 id="sessionName">Loading…</h2>
  <p id="sessionDate"></p>
</div>

<div class="wrap">
  <div class="count-strip">
    <div class="count-card"><div class="num" id="countExpected">–</div><div class="lbl">Expected</div></div>
    <div class="count-card"><div class="num" id="countSignedIn">–</div><div class="lbl">Signed in</div></div>
  </div>

  <div id="rowsWrap">
    <div class="loading">Loading the register…</div>
  </div>

  <div class="add-row">
    <input type="text" id="walkInName" placeholder="Walk-in name (not pre-booked)">
    <button type="button" id="walkInBtn">Sign in</button>
  </div>

  <div class="footer">H.O.M.E Hub CIC · Bringing unity back to the Community</div>
</div>

<script>
/* ═══ KIOSK PRIVACY GUARD ═══
   Public kiosk pages used to read the whole visitors and sign_ins lists
   straight from the database. This guard quietly re-routes those
   logged-out requests to narrow database functions that answer only the
   question being asked (e.g. "does anyone match this name?") and never
   hand back contact details. The page itself works exactly as before.
   Signed-in staff requests are left completely alone. 💚 */
(function(){
  if(window.__hwKioskGuard) return; window.__hwKioskGuard = true;
  var realFetch = window.fetch.bind(window);
  function hdr(h, name){
    if(!h) return null;
    if(typeof Headers !== 'undefined' && h instanceof Headers) return h.get(name);
    for(var k in h){ if(Object.prototype.hasOwnProperty.call(h,k) && k.toLowerCase() === name) return h[k]; }
    return null;
  }
  function json(body, status){ return new Response(JSON.stringify(body), {status: status || 200, headers: {'content-type':'application/json'}}); }
  function empty(status){ return new Response(null, {status: status || 204}); }
  window.fetch = async function(input, init){
    var url = typeof input === 'string' ? input : ((input && input.url) || '');
    var m = url.match(/^(https:\/\/[^\/]+)\/rest\/v1\/(visitors|sign_ins|volunteer_shifts)(\?.*)?$/);
    if(!m) return realFetch(input, init);
    init = init || {};
    var headers = init.headers || (typeof input !== 'string' && input.headers) || {};
    var apikey = hdr(headers, 'apikey');
    var auth = hdr(headers, 'authorization') || '';
    if(!apikey || (auth && auth !== 'Bearer ' + apikey)) return realFetch(input, init); // signed-in: untouched
    try{
      var base = m[1], table = m[2], qs = new URLSearchParams((m[3] || '').slice(1));
      var method = String(init.method || 'GET').toUpperCase();
      var prefer = hdr(headers, 'prefer') || '';
      var rpc = function(fn, args){
        return realFetch(base + '/rest/v1/rpc/' + fn, {method:'POST',
          headers:{apikey: apikey, Authorization: 'Bearer ' + apikey, 'Content-Type':'application/json'},
          body: JSON.stringify(args)}).then(function(r){
            return r.text().then(function(t){
              var d = t ? JSON.parse(t) : null;
              if(!r.ok) throw new Error((d && d.message) || ('error ' + r.status));
              return d;
            });
          });
      };
      var filt = function(key, op){
        var all = qs.getAll(key);
        for(var i = 0; i < all.length; i++){ if(all[i].indexOf(op + '.') === 0) return all[i].slice(op.length + 1); }
        return null;
      };
      var body = null;
      if(init.body){ try{ body = JSON.parse(init.body); }catch(e){ body = null; } }
      var firstRow = Array.isArray(body) ? body[0] : body;

      if(table === 'visitors'){
        if(method === 'GET'){
          var name = filt('full_name', 'ilike') || '';
          var partial = /^\*.*\*$/.test(name);
          var rows = await rpc('kiosk_search_visitors', {p_q: name.replace(/^\*|\*$/g, ''), p_exact: !partial});
          return json((rows || []).map(function(v){
            return {id: v.id, full_name: v.full_name, is_co_creator: v.is_co_creator,
                    email: null, mobile: null, _has_email: v.has_email, _has_mobile: v.has_mobile};
          }));
        }
        if(method === 'POST'){
          var created = await rpc('kiosk_create_visitor', {p: firstRow || {}});
          return /representation/.test(prefer) || !prefer ? json(created || [], 201) : empty(201);
        }
        if(method === 'PATCH'){
          await rpc('kiosk_fill_visitor', {p_id: filt('id', 'eq'), p: firstRow || {}});
          return /representation/.test(prefer) ? json([], 200) : empty(204);
        }
        return json({message: 'Not allowed'}, 403);
      }

      if(table === 'sign_ins'){
        if(method === 'POST'){
          // Save it, but never ask for rows back (logged-out visitors can't read sign-ins).
          var h2 = {};
          if(typeof Headers !== 'undefined' && headers instanceof Headers){ headers.forEach(function(v, k){ h2[k] = v; }); }
          else { for(var k in headers){ h2[k] = headers[k]; } }
          for(var k2 in h2){ if(k2.toLowerCase() === 'prefer') delete h2[k2]; }
          h2.Prefer = 'return=minimal';
          var r = await realFetch(base + '/rest/v1/sign_ins', Object.assign({}, init, {headers: h2}));
          if(!r.ok) return r;
          return /representation/.test(prefer) || !prefer ? json(Array.isArray(body) ? body : [body], 201) : empty(201);
        }
        if(method !== 'GET') return json({message: 'Not allowed'}, 403);
        var sel = qs.get('select') || '*';
        var vid = filt('visitor_id', 'eq'), vname = filt('visitor_name', 'ilike');
        var sess = filt('session_name', 'eq'), sessLike = filt('session_name', 'ilike');
        var gte = filt('signed_in_at', 'gte'), lte = filt('signed_in_at', 'lte');
        var dayStart = new Date(); dayStart.setHours(0,0,0,0);
        if(sel === 'id' && (vid || vname)){
          var yes = await rpc('kiosk_signed_in_check', {p_visitor: vid || null, p_name: vname ? vname.replace(/^\*|\*$/g,'') : null,
            p_session: sess || null, p_from: gte || dayStart.toISOString(), p_to: lte || new Date().toISOString()});
          return json(yes ? [{id: 'existing'}] : []);
        }
        if(sel === 'id'){
          var n = await rpc('kiosk_signin_count', {p_from: gte || dayStart.toISOString(), p_to: lte || new Date().toISOString()});
          var out = []; for(var i = 0; i < (n || 0); i++) out.push({id: i});
          return json(out);
        }
        if(vid && /session_name/.test(sel)){
          return json(await rpc('kiosk_visitor_history', {p_visitor: vid, p_since: gte || '1970-01-01T00:00:00Z'}) || []);
        }
        if(/visitor_name/.test(sel) && sess && !gte){
          return json(await rpc('kiosk_group_members', {p_session: sess}) || []);
        }
        if(sel === 'visitor_name' && gte){
          return json(await rpc('kiosk_names_signed_in', {p_from: gte, p_to: lte || gte,
            p_session_like: sessLike ? sessLike.replace(/^\*|\*$/g, '') : null}) || []);
        }
        if(/session_name/.test(sel) && /reason_for_attending/.test(sel) && gte){
          var agg = await rpc('kiosk_signin_popularity', {p_since: gte}) || [], expanded = [];
          agg.forEach(function(a){ for(var j = 0; j < Math.min(a.n || 0, 500); j++) expanded.push({session_name: a.session_name, reason_for_attending: a.reason_for_attending}); });
          return json(expanded);
        }
        return json([]);
      }

      if(table === 'volunteer_shifts'){
        if(method !== 'GET') return json({message: 'Not allowed'}, 403);
        return json(await rpc('kiosk_volunteer_shift', {p_visitor: filt('volunteer_id', 'eq'), p_day: filt('day_of_week', 'ilike') || ''}) || []);
      }
    }catch(e){
      return json({message: e.message || 'Kiosk lookup failed'}, 500);
    }
    return realFetch(input, init);
  };
})();
</script>
<script>
var SUPABASE_URL = 'https://tdwxyzjwktdwhszugkah.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkd3h5emp3a3Rkd2hzenVna2FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDI1MjMsImV4cCI6MjA5NDU3ODUyM30.66D9iFNhJ-vXhFIUnUoSru_NpoGtSdKiSMjChLfCKXo';

var params = new URLSearchParams(window.location.search);
var sessionId = params.get('id') || '';
var sessionName = params.get('name') || 'Session';
var date = params.get('date') || '';
var kind = params.get('kind') || 'session';

document.getElementById('sessionName').textContent = sessionName;
document.getElementById('sessionDate').textContent = date ? new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'}) : '';

async function sb(path, opts){
  opts = opts || {};
  var headers = Object.assign({
    apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json'
  }, opts.headers || {});
  var res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, {headers: headers}));
  var text = await res.text();
  return {ok: res.ok, data: text ? JSON.parse(text) : null};
}

var expectedRows = [];
var signedInNames = [];

async function loadRegister(){
  var wrap = document.getElementById('rowsWrap');
  try{
    if(kind === 'session' && sessionId){
      var res = await sb('session_checkin_view?bookable_session_id=eq.'+sessionId+'&booking_date=eq.'+date+'&status=neq.cancelled&order=slot_start.asc');
      expectedRows = res.data || [];
    } else {
      expectedRows = [];
    }
    var signedRes = await sb('sign_ins?session_name=ilike.*'+encodeURIComponent(sessionName)+'*&signed_in_at=gte.'+date+'T00:00:00&signed_in_at=lte.'+date+'T23:59:59&select=visitor_name');
    signedInNames = (signedRes.data || []).map(function(v){ return v.visitor_name.toLowerCase(); });

    renderRows();
  }catch(e){
    wrap.innerHTML = '<div class="empty">Couldn\'t load the register. Please check the link or try again.</div>';
  }
}

function renderRows(){
  var wrap = document.getElementById('rowsWrap');
  document.getElementById('countExpected').textContent = expectedRows.length;
  document.getElementById('countSignedIn').textContent = signedInNames.length;

  if(!expectedRows.length){
    wrap.innerHTML = '<div class="empty">'+(kind === 'group' ? 'This is a drop-in group — use "Walk-in" below to sign people in as they arrive.' : 'Nobody booked in for this date yet.')+'</div>';
    return;
  }
  wrap.innerHTML = expectedRows.map(function(r){
    var isIn = signedInNames.indexOf(r.client_name.toLowerCase()) !== -1;
    return '<div class="row">' +
      '<div class="row-name"><strong>'+r.client_name+'</strong>'+(r.slot_start ? '<span>'+r.slot_start.slice(0,5)+'</span>' : '')+'</div>' +
      '<button type="button" class="checkin-btn'+(isIn?' done':'')+'" data-name="'+r.client_name.replace(/"/g,'&quot;')+'" '+(isIn?'disabled':'')+'>'+(isIn?'Signed in ✓':'Sign in')+'</button>' +
    '</div>';
  }).join('');

  wrap.querySelectorAll('.checkin-btn:not([disabled])').forEach(function(btn){
    btn.addEventListener('click', function(){ checkIn(btn.getAttribute('data-name'), btn); });
  });
}

async function checkIn(name, btn){
  btn.disabled = true;
  btn.textContent = '…';
  try{
    // The list of who's already in was fetched when this page first
    // loaded — if it's been open a while, or someone got signed in via a
    // different route (the QR page, Heartwood itself) in the meantime,
    // that snapshot is stale. A live re-check right here, right before
    // the insert, is what actually stops the duplicate. 💚
    var today = date;
    var dupRes = await sb('sign_ins?visitor_name=ilike.'+encodeURIComponent(name)+'&session_name=eq.'+encodeURIComponent(sessionName)+'&signed_in_at=gte.'+today+'T00:00:00&signed_in_at=lte.'+today+'T23:59:59&select=id&limit=1');
    var alreadyIn = dupRes.ok && dupRes.data && dupRes.data.length;
    if(!alreadyIn){
      await sb('sign_ins', {
        method: 'POST', headers: {Prefer: 'return=minimal'},
        body: JSON.stringify({
          visitor_name: name, session_name: sessionName,
          visit_type: kind === 'group' ? 'group' : 'booked_session',
          signed_in_at: new Date().toISOString()
        })
      });
    }
    signedInNames.push(name.toLowerCase());
    btn.classList.add('done');
    btn.textContent = 'Signed in ✓';
    document.getElementById('countSignedIn').textContent = signedInNames.length;
  }catch(e){
    btn.disabled = false;
    btn.textContent = 'Try again';
  }
}

document.getElementById('walkInBtn').addEventListener('click', function(){
  var input = document.getElementById('walkInName');
  var name = input.value.trim();
  if(!name) return;
  expectedRows.unshift({client_name: name, slot_start: null});
  input.value = '';
  renderRows();
});

loadRegister();
</script>
</body>
</html>
