<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Group Register | H.O.M.E Hub</title>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dg:#006837;--lg:#39b54a;--db:#0e386a;--or:#f58221;--bg:#f5f6fa;--card:#fff;--border:#e2e8f0;--text:#1a202c;--muted:#64748b;--radius:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:120px}
input,select,button{font-family:'Montserrat',sans-serif;font-size:16px}
.header{background:var(--db);padding:16px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.header-top{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
.header h1{font-family:'League Spartan',sans-serif;font-size:1rem;font-weight:700;color:#fff}
.badge{background:var(--lg);color:#fff;padding:6px 14px;border-radius:20px;font-size:.78rem;font-weight:700}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 0}
.dt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dt-row label{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.dt-row input{width:100%;padding:9px 10px;border-radius:9px;border:1.5px solid var(--border)}
.member{border:1.5px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;overflow:hidden}
.member.checked{border-color:var(--dg);background:#f0fdf4}
.member-row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;touch-action:manipulation}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.member.checked .check{border-color:var(--dg);background:var(--dg)}
.member-name{font-size:.92rem;font-weight:600;color:var(--text);flex:1}
.reason-wrap{padding:0 14px 12px 50px}
.reason-wrap select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--border);font-size:.82rem}
.add-row{display:flex;gap:8px;margin:16px 0}
.add-row input{flex:1;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border)}
.add-row button{background:var(--db);color:#fff;border:none;border-radius:10px;padding:0 18px;font-weight:700;font-size:.85rem;cursor:pointer}
.empty{text-align:center;padding:30px 16px;color:var(--muted);font-size:.85rem;line-height:1.6}
.loading{text-align:center;padding:40px 16px;color:var(--muted);font-size:.9rem}
.footer-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:14px 18px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.submit-btn{width:100%;max-width:640px;margin:0 auto;display:block;background:var(--dg);color:#fff;border:none;border-radius:12px;padding:15px;font-weight:700;font-size:.95rem;cursor:pointer}
.submit-btn:disabled{opacity:.6}
.footnote{text-align:center;padding:20px 16px 4px;font-size:.68rem;color:var(--muted)}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1 id="groupTitle">Group Register</h1>
    <div class="badge" id="countBadge">0 selected</div>
  </div>
</div>

<div class="wrap">
  <div class="dt-row">
    <div><label>Date</label><input type="date" id="regDate"></div>
    <div><label>Time</label><input type="time" id="regTime"></div>
  </div>

  <div id="memberList">
    <div class="loading">Loading everyone who's attended before…</div>
  </div>

  <div class="add-row">
    <input type="text" id="addName" placeholder="Add someone new">
    <button type="button" id="addBtn">+ Add</button>
  </div>
</div>

<div class="footer-bar">
  <button class="submit-btn" id="submitBtn">Sign in selected</button>
</div>
<div class="footnote">H.O.M.E Hub CIC · Bringing unity back to the Community</div>

<script>
var SUPABASE_URL = 'https://tdwxyzjwktdwhszugkah.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkd3h5emp3a3Rkd2hzenVna2FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDI1MjMsImV4cCI6MjA5NDU3ODUyM30.66D9iFNhJ-vXhFIUnUoSru_NpoGtSdKiSMjChLfCKXo';

var params = new URLSearchParams(window.location.search);
var groupName = params.get('group') || 'Group';
document.getElementById('groupTitle').textContent = groupName;
document.title = groupName + ' Register | H.O.M.E Hub';

function localDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localTimeStr(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
var now = new Date();
document.getElementById('regDate').value = localDateStr(now);
document.getElementById('regTime').value = localTimeStr(now);

async function sb(path, opts){
  opts = opts || {};
  var headers = Object.assign({apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer '+SUPABASE_ANON_KEY, 'Content-Type':'application/json'}, opts.headers||{});
  var res = await fetch(SUPABASE_URL+'/rest/v1/'+path, Object.assign({}, opts, {headers: headers}));
  var text = await res.text();
  var data = text ? JSON.parse(text) : null;
  if(!res.ok) throw new Error((data && (data.message||data.error)) || 'Request failed');
  return data;
}

var members = [];
var selected = {};
var reasons = {};
var reasonOptions = ['Social Connection','Personal Development','Mental Wellbeing','Learning a New Skill','Volunteering','Prefer Not to Say'];

async function loadReasonsList(){
  try{
    var r = await sb('sign_in_reasons?select=name&is_active=eq.true&order=sort_order');
    if(r && r.length) reasonOptions = r.map(function(x){ return x.name; });
  }catch(e){ /* keep the sensible defaults */ }
}

async function loadMembers(){
  try{
    var rows = await sb('sign_ins?select=visitor_id,visitor_name,reason_for_attending&session_name=eq.'+encodeURIComponent(groupName));
    var byName = {};
    (rows||[]).forEach(function(r){
      var name = (r.visitor_name||'').trim();
      if(!name) return;
      var key = name.toLowerCase();
      if(!byName[key]) byName[key] = {id: r.visitor_id||null, name: name, reasons: {}};
      if(r.visitor_id && !byName[key].id) byName[key].id = r.visitor_id;
      var reason = (r.reason_for_attending||'').trim();
      if(reason) byName[key].reasons[reason] = (byName[key].reasons[reason]||0)+1;
    });
    members = Object.keys(byName).map(function(k){
      var m = byName[k];
      var top = Object.keys(m.reasons).sort(function(a,b){ return m.reasons[b]-m.reasons[a]; })[0] || '';
      return {id: m.id, name: m.name, topReason: top};
    });
    members.sort(function(a,b){ return a.name.localeCompare(b.name); });
    members.forEach(function(m){ reasons[m.name] = m.topReason || ''; });
    renderMembers();
  }catch(e){
    document.getElementById('memberList').innerHTML = '<div class="empty">Couldn\u2019t load the register \u2014 please check the link, or try again in a moment.</div>';
  }
}

function renderMembers(){
  var el = document.getElementById('memberList');
  if(!members.length){
    el.innerHTML = '<div class="empty">No previous attendees found yet for this group.<br>Use "Add someone new" below \u2014 they\u2019ll be remembered next time.</div>';
    return;
  }
  el.innerHTML = members.map(function(m){
    var checked = !!selected[m.name];
    var reason = reasons[m.name] || '';
    var opts = reasonOptions.map(function(r){ return '<option value="'+r.replace(/"/g,'&quot;')+'" '+(r===reason?'selected':'')+'>'+r+'</option>'; }).join('');
    return '<div class="member'+(checked?' checked':'')+'">' +
      '<div class="member-row" onclick="toggleMember(\''+m.name.replace(/'/g,"\\'")+'\')">' +
        '<div class="check">'+(checked?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</div>' +
        '<div class="member-name">'+m.name+'</div>' +
      '</div>' +
      (checked ? '<div class="reason-wrap"><select onchange="setReason(\''+m.name.replace(/'/g,"\\'")+'\', this.value)" onclick="event.stopPropagation()">'+opts+'</select></div>' : '') +
    '</div>';
  }).join('');
}

function toggleMember(name){
  selected[name] = selected[name] ? null : name;
  if(selected[name] && !reasons[name]){
    var m = members.find(function(x){ return x.name===name; });
    reasons[name] = (m && m.topReason) || reasonOptions[0] || '';
  }
  renderMembers();
  updateBadge();
}
function setReason(name, val){ reasons[name] = val; }

function updateBadge(){
  var count = Object.values(selected).filter(Boolean).length;
  document.getElementById('countBadge').textContent = count + (count===1?' person selected':' people selected');
  document.getElementById('countBadge').style.background = count ? '#39b54a' : 'rgba(255,255,255,.25)';
  document.getElementById('submitBtn').textContent = count ? 'Sign in '+count+' '+(count===1?'person':'people') : 'Sign in selected';
}

document.getElementById('addBtn').addEventListener('click', function(){
  var input = document.getElementById('addName');
  var name = input.value.trim();
  if(!name) return;
  var exists = members.some(function(m){ return m.name.toLowerCase()===name.toLowerCase(); });
  if(!exists){
    members.push({id:null, name:name, topReason:''});
    members.sort(function(a,b){ return a.name.localeCompare(b.name); });
  }
  selected[name] = name;
  if(!reasons[name]) reasons[name] = reasonOptions[0] || '';
  input.value = '';
  renderMembers();
  updateBadge();
});

document.getElementById('submitBtn').addEventListener('click', async function(){
  var chosen = Object.entries(selected).filter(function(e){ return e[1]; });
  if(!chosen.length){ alert('Please tick at least one person first.'); return; }
  var btn = this;
  btn.disabled = true; btn.textContent = 'Signing in…';

  var dateVal = document.getElementById('regDate').value;
  var timeVal = document.getElementById('regTime').value || '12:00';
  var signedIn = dateVal ? new Date(dateVal+'T'+timeVal+':00') : new Date();
  if(isNaN(signedIn.getTime())) signedIn = new Date();
  var signOut = new Date(signedIn); signOut.setHours(signOut.getHours()+4);
  var signInDateStr = localDateStr(signedIn);

  var alreadyIn = {};
  try{
    var existing = await sb('sign_ins?select=visitor_name&signed_in_at=gte.'+signInDateStr+'T00:00:00&signed_in_at=lte.'+signInDateStr+'T23:59:59');
    (existing||[]).forEach(function(s){ alreadyIn[(s.visitor_name||'').trim().toLowerCase()] = true; });
  }catch(e){ /* proceed without the duplicate check rather than block the whole register */ }

  var membersByName = {};
  members.forEach(function(m){ membersByName[m.name] = m; });
  var skipped = [];
  var rows = chosen.filter(function(e){
    var dup = alreadyIn[(e[1]||'').trim().toLowerCase()];
    if(dup) skipped.push(e[1]);
    return !dup;
  }).map(function(e){
    var name = e[1];
    var m = membersByName[name];
    return {
      visitor_id: (m && m.id) || null, visitor_name: name,
      session_name: groupName, reason_for_attending: reasons[name] || 'Social Connection',
      visit_type: 'community', signed_in_at: signedIn.toISOString(),
      signed_out_at: signOut.toISOString(), auto_signed_out: true
    };
  });

  if(!rows.length){
    btn.disabled = false; btn.textContent = 'Sign in selected';
    alert(skipped.length ? 'Everyone selected is already signed in for today.' : 'Nothing to sign in.');
    return;
  }

  try{
    await sb('sign_ins', {method:'POST', headers:{Prefer:'return=minimal'}, body: JSON.stringify(rows)});
    var msg = rows.length + ' ' + (rows.length===1?'person':'people') + ' signed in \u2713';
    if(skipped.length) msg += ' (' + skipped.length + ' already signed in today, skipped)';
    alert(msg);
    selected = {};
    renderMembers();
    updateBadge();
  }catch(e){
    alert('Could not save \u2014 ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Sign in selected';
  }
});

(async function(){
  await loadReasonsList();
  await loadMembers();
  updateBadge();
})();
</script>
</body>
</html>
